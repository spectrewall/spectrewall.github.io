<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
  {% if page.mathjax %}
  <!-- kramdown's default math_engine is mathjax: it re-serializes any $$..$$ / \(..\) / \[..\]
       written in a page's markdown into MathJax's own default delimiters, \(..\) and \[..\],
       before this ever reaches the browser. So MathJax is left on its built-in defaults here
       rather than pinned to $..$ / $$..$$, which kramdown's output would never match. -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {% endif %}
</head>
<body>
  <div class="topbar">
    <a href="{{ '/' | relative_url }}" style="font-family:'Fraunces',serif; font-weight:700; color:var(--text); font-size:15px;">SpectreWall</a>
    <div class="topbar-links">
      <a href="https://github.com/spectrewall" target="_blank" rel="noopener">GitHub</a>
      <button class="theme-toggle" onclick="toggleTheme()" type="button">Toggle theme</button>
    </div>
  </div>

  <div class="shell">
    {% include sidebar.html %}

    <main class="content{% unless page.mod %} home{% endunless %}">
      <div class="page-body">
        {{ content }}
      </div>
    </main>
  </div>

  <footer class="footer">Copyright 2026 SpectreWall.</footer>

  <script>
    function toggleTheme() {
      var root = document.documentElement;
      var current = root.getAttribute('data-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var effectiveDark = current === 'dark' || (!current && prefersDark);
      var next = effectiveDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    }
  </script>
</body>
</html>
